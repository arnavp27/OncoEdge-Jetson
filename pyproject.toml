[project]
name = "oncoedge"
version = "0.1.0"
description = "AI-Powered Oral Cancer Detection System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "ultralytics>=8.4.8",
    "open-clip-torch>=3.2.0",
    "streamlit>=1.54.0",
    "opencv-python>=4.12.0",
    "pillow>=12.1.0",
    "numpy>=2.3.0",
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
