services:
  caddy:
    image: caddy:2-alpine@sha256:d44355d3c2149dc580ce2cac735955d1c08d3d00882c30489c241aa51a5c10d9
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      ONCOEDGE_DOMAIN: ${ONCOEDGE_DOMAIN:?Set ONCOEDGE_DOMAIN to the demo hostname}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      oncoedge:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - edge

volumes:
  caddy_data:
  caddy_config:
